name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The MCP server is published as a lean package and a Claude Desktop bundle; check both are valid.
      - name: Stage the MCP package
        run: npm run package:mcp
      - name: Validate the Claude Desktop manifest
        run: npx mcpb validate packaging/mcpb/manifest.json
      - name: Check what would be published
        working-directory: mcp-server/dist-mcp
        run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: mcp-server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the MCP server image over real stdio against a local stub of GitHub.
  mcp-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Build the MCP image
        run: docker build --target mcp -t issuewatcher-mcp:ci mcp-server
      - name: Build the tests
        working-directory: mcp-server
        run: npm ci && npm run build
      - name: Run the Docker tests
        working-directory: mcp-server
        env:
          IW_DOCKER_IMAGE: issuewatcher-mcp:ci
        run: node --test build/__tests__/mcp-docker.test.js
